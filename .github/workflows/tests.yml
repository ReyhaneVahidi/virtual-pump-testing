# Continuous Integration: run the project's tests on every push and pull request.
name: Python tests

on:
  push:
  pull_request:

# The workflow only needs permission to read the repository's code.
permissions:
  contents: read

jobs:
  test:
    name: Run unit and API tests
    runs-on: ubuntu-latest

    steps:
      # Download the exact commit that triggered this workflow.
      - name: Check out repository
        uses: actions/checkout@v6

      # Use one explicit Python version to keep CI results consistent.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      # Re-create the application and test dependencies in a clean runner.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Run the same test command used during local development.
      - name: Run pytest
        run: python -m pytest -v
